<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>loom demo</title>
    <script type="importmap">
      {
        "imports": {
          "@loom/core": "/packages/core/index.js"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import { h, mount, FRAGMENT } from "@loom/core";

      const tasks = [
        "VNode data structure",
        "h() and children normalization",
        "mount() creates real DOM",
        "props: attribute / property / event",
        "fragments and nested children",
      ];

      let clicks = 0;

      const app = h(
        "div",
        {
          class: "app",
          style: {
            fontFamily: "system-ui, sans-serif",
            maxWidth: "560px",
            margin: "40px auto",
            lineHeight: "1.6",
          },
        },
        [
          h("h1", { style: { fontSize: "22px", marginBottom: "4px" } }, [
            "loom — phase 1",
          ]),

          h("p", { style: { color: "#666" } }, ["Days completed: ", 5, " / 7"]),

          h(FRAGMENT, {}, [
            h("h2", { style: { fontSize: "16px" } }, ["Done"]),
            h("ul", {}, [tasks.map((task) => h("li", {}, [task]))]),
          ]),

          h(
            "button",
            {
              id: "counter",
              style: { padding: "8px 14px", cursor: "pointer" },
              onClick: (event) => {
                clicks += 1;
                event.target.textContent = `Clicked: ${clicks}`;
              },
            },
            ["Clicked: 0"],
          ),

          h("p", {}, [
            h("input", { type: "checkbox", checked: true }),
            " checked is a property, not an attribute",
          ]),

          h("p", { style: { color: "#666", fontSize: "13px" } }, [
            "falsy filtering: ",
            null,
            false,
            undefined,
            "only this text is rendered",
          ]),
        ],
      );

      mount(app, document.body);
    </script>
  </body>
</html>
