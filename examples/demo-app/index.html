<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>loom demo</title>
    <script type="importmap">
      {
        "imports": {
          "@loom/core": "/packages/core/index.js"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import { h, mount, patch, FRAGMENT } from "@loom/core";

      let items = ["alpha", "beta", "gamma", "delta", "epsilon"];
      let clicks = 0;
      let tree = null;

      const update = () => {
        const next = view();
        patch(tree, next, document);
        tree = next;
      };

      const increment = () => {
        clicks += 1;
        update();
      };

      const shuffle = () => {
        items = [...items].sort(() => Math.random() - 0.5);
        update();
      };

      const buttonStyle = {
        padding: "8px 14px",
        marginRight: "8px",
        cursor: "pointer",
      };

      const view = () =>
        h(
          "div",
          {
            class: "app",
            style: {
              fontFamily: "system-ui, sans-serif",
              maxWidth: "560px",
              margin: "40px auto",
              lineHeight: "1.6",
            },
          },
          [
            h("h1", { style: { fontSize: "22px", marginBottom: "4px" } }, [
              "loom",
            ]),

            h(FRAGMENT, {}, [
              h("p", { style: { color: "#666" } }, [
                "Everything below is produced by h(), mount() and patch().",
              ]),
            ]),

            h("button", { onClick: increment, style: buttonStyle }, [
              `Clicked: ${clicks}`,
            ]),
            h("button", { onClick: shuffle, style: buttonStyle }, ["Shuffle"]),

            h(
              "p",
              { style: { color: "#666", fontSize: "13px", marginTop: "24px" } },
              [
                "Type something into a box, then press Shuffle. The text ",
                "travels with its item: keyed diff moves the existing DOM ",
                "nodes instead of recreating them.",
              ],
            ),

            h(
              "ul",
              { style: { paddingLeft: "18px" } },
              [
                items.map((item) =>
                  h("li", { key: item, style: { marginBottom: "6px" } }, [
                    h(
                      "span",
                      { style: { display: "inline-block", width: "80px" } },
                      [item],
                    ),
                    h("input", { placeholder: "type here" }),
                  ]),
                ),
              ],
            ),

            h("p", { style: { color: "#666", fontSize: "13px" } }, [
              "falsy filtering: ",
              null,
              false,
              undefined,
              "only this text is rendered",
            ]),
          ],
        );

      tree = view();
      mount(tree, document.body);
    </script>
  </body>
</html>
